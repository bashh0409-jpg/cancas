name: Daily Purge Trashed Canvases

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-trash:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not configured." >&2
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not configured." >&2
            exit 1
          fi

      - name: Trigger purge endpoint
        id: purge
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Calling ${APP_URL}/api/admin/purge-trash"

          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "${APP_URL}/api/admin/purge-trash" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d '{}' \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60)

          echo "$RESPONSE"

          DELIMITER=$(uuidgen)

          {
            echo "result<<$DELIMITER"
            echo "$RESPONSE"
            echo "$DELIMITER"
          } >> $GITHUB_OUTPUT

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Purge trash cron job FAILED"
          echo "::error::Check logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          exit 1